<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Big Water Consulting Client Map</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Custom Styles -->
    <style>
        body, #map {
            margin: 0;
            position: relative;
        }

        html, body, #map {
            height: 100%;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 400;
            font-family: "Open Sans", sans-serif;
            line-height: 1.2;
        }

        .leaflet-popup-content {
            text-align: center;
            color: black;
            font-weight: 300;
        }

        #popupimg img {
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <!-- Placeholder for map -->
    <div id="map"></div>

    <script>
        $(document).ready(function () {
            // Initialize the map
            var map = L.map('map', { scrollWheelZoom: false }).setView([54, -125], 4);

            // Add base tiles
            L.tileLayer(
                'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                {
                    attribution:
                        'Map tiles by <a href="https://carto.com">Carto</a> | Data by <a href="http://openstreetmap.org">OpenStreetMap</a>, under <a href="http://www.openstreetmap.org/copyright">ODbL</a> | Prepared by <a href="http://www.bigwaterconsulting.net">Big Water Consulting</a>',
                    subdomains: 'abcd',
                    maxZoom: 19,
                }
            ).addTo(map);

            // GeoJSON data
            var data = {
                "type": "FeatureCollection",
                "features": [
                    {
                        "type": "Feature",
                        "geometry": {
                            "type": "Point",
                            "coordinates": [-114.1147261972959, 47.62534062543333]
                        },
                        "properties": {
                            "name": "Salish and Kootenai Housing Authority",
                            "descriptio": "Flathead Indian Reservation, Montana",
                            "cimage": "<a href='https://www.bigwaterconsulting.net/projects/flatheadhousing' target=\"_blank\"><img src='./imgs/SKHA_Logo_RGB.png' width='100px' height='125px'></a>"
                        }
                    },
                    {
                        "type": "Feature",
                        "geometry": {
                            "type": "Point",
                            "coordinates": [-122.88707054170864, 39.02021815055719]
                        },
                        "properties": {
                            "name": "Big Valley Rancheria",
                            "descriptio": "Big Valley Rancheria, California",
                            "cimage": "<a href='https://www.bigwaterconsulting.net/projects/big-valley-rancheria-community-needs-assessment' target=\"_blank\"><img src='./imgs/BVR-Logo.png' width='125px' height='140px'></a>"
                        }
                    }
                ]
            };

            // Add GeoJSON data to the map
            L.geoJson(data, {
                pointToLayer: function (feature, latlng) {
                    // Extract the image URL from the `cimage` property
                    var cimageHtml = feature.properties.cimage || '';
                    var cimageUrl = './imgs/default-marker.png'; // Default marker in case no valid image is found

                    // Attempt to extract the `src` attribute from the <img> tag
                    if (cimageHtml.includes('<img')) {
                        var match = cimageHtml.match(/<img.*?src=["'](.*?)["']/);
                        if (match && match[1]) {
                            cimageUrl = match[1];
                        }
                    }

                    // Define a custom icon using the extracted URL
                    var dynamicIcon = L.icon({
                        iconUrl: cimageUrl,
                        iconSize: [30, 40],
                        iconAnchor: [15, 40],
                        popupAnchor: [0, -40],
                    });

                    // Return a marker with the dynamically created icon
                    return L.marker(latlng, { icon: dynamicIcon });
                },
                onEachFeature: function (feature, layer) {
                    // Create custom popup content
                    var customPopup = `
                        <h3>${feature.properties.name}</h3>
                        <p>${feature.properties.descriptio}</p>
                        ${feature.properties.cimage || ''}
                    `;
                    layer.bindPopup(customPopup); // Bind the popup to the marker
                }
            }).addTo(map);
        });
    </script>
</body>

</html>
