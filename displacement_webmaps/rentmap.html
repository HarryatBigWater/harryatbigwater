<!DOCTYPE html> 
<html>
<head>
    <title>HUD Estimated Rent Changes 2015 - 2025</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <script type="text/javascript" src="rent_updated.js"></script>
    <style>
        body, html, #map {
            height: 100%;
            margin: 0;
            font-family: 'Open Sans', sans-serif;
        }
        .info {
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            color: #6b8cb9;
        }
        .info h4 {
            margin: 0 0 5px;
            text-align: center;
            color: #0b3e6b;
        }
        .legend {
            line-height: 18px;
            color: #6b8cb9;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 8px;
            border-radius: 5px;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
        }
        .filter {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .filter select {
            width: 150px;
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body>
<div id="map"></div>
<div class="filter">
    <label for="bedroomFilter">Select Bedroom Type:</label>
    <select id="bedroomFilter">
        <option value="studio">Studio</option>
        <option value="one_br" selected>One Bedroom</option>
        <option value="two_br">Two Bedrooms</option>
        <option value="three_br">Three Bedrooms</option>
        <option value="four_br">Four Bedrooms</option>
    </select>
</div>
<script>
    // Initialize Map with adjusted fitBounds for contiguous US
    var map = L.map('map', {
        maxZoom: 10,
        minZoom: 4
    });

    // Define refined bounding box for contiguous US
    var usBounds = [
        [28.0, -124.0], // Southwest corner
        [47.0, -66.0]   // Northeast corner
    ];
    map.fitBounds(usBounds);

    // Add Base Map Layer
    var tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: 'Map tiles by <a href="https://carto.com">Carto</a>, Data by <a href="http://openstreetmap.org">OSM</a>',
        subdomains: 'abcd',
        maxZoom: 15
    }).addTo(map);

    // Info Box Control
    var info = L.control();
    info.onAdd = function () {
        this._div = L.DomUtil.create('div', 'info');
        this.update();
        return this._div;
    };

    info.update = function (props) {
        this._div.innerHTML = '<h4>HUD Estimated Median Monthly Rent Changes<br>2015 to 2025</h4>' + (props ?
            '<b>' + props.areaname18 + '</b><br />' +
            'Rent, 2015*: $' + numberWithCommas(props.b1_i) + '<br />' +
            'Rent, 2025: $' + numberWithCommas(props.re_1) + '<br />' +
            'Rent Increase: $' + numberWithCommas(props.re_1 - props.b1_i) + '<br />' +
            '<small>*Adjusted for inflation to 2025 prices.</small>'
            : 'Hover over a region');
    };
    info.addTo(map);

    // Legend Control
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
        var div = L.DomUtil.create('div', 'legend');
        var grades = [300, 150, 50, -50, -150, -300];
        var labels = ['Increase $300+', 'Increase $150-$300', 'Increase $50-$150', 'Decrease $50-$150', 'Decrease $150-$300', 'Decrease $300+'];

        div.innerHTML = '<h4>Rent Changes</h4>';
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML +=
                '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                labels[i] + '<br>';
        }
        return div;
    };
    legend.addTo(map);

    // Color function
    function getColor(d) {
        return d > 300 ? '#d73027' :
               d > 150 ? '#fc8d59' :
               d > 50 ? '#fee08b' :
               d > -50 ? '#ffffbf' :
               d > -150 ? '#d9ef8b' :
               d > -300 ? '#91cf60' : '#1a9850';
    }

    function getSelectedVariable() {
        const selected = document.getElementById('bedroomFilter').value;
        return selected === 'studio' ? 'b0_i' :
               selected === 'one_br' ? 'b1_i' :
               selected === 'two_br' ? 'b2_i' :
               selected === 'three_br' ? 'b3_i' : 'b4_i';
    }

    function style(feature) {
        const variable = getSelectedVariable();
        return {
            fillColor: getColor(feature.properties.re_1 - feature.properties[variable]),
            weight: 1,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.7
        };
    }

    var geojson = L.geoJson(rentData, {
        style: style,
        onEachFeature: function (feature, layer) {
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight,
                click: zoomToFeature
            });
        }
    }).addTo(map);

    $('#bedroomFilter').on('change', function() {
        geojson.setStyle(style);
    });

    function highlightFeature(e) {
        var layer = e.target;
        layer.setStyle({
            weight: 2,
            color: '#555',
            fillOpacity: 0.7
        });
        info.update(layer.feature.properties);
    }

    function resetHighlight(e) {
        geojson.resetStyle(e.target);
        info.update();
    }

    function numberWithCommas(number) {
        return parseFloat(number).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
</script>
</body>
</html>
