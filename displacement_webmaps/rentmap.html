<!DOCTYPE html>
<html>
<head>
    <title>HUD Estimated Rent Changes 2015 - 2025</title>
    <script
        src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha256-3edrmyuQ0w65f8gfBsqowzjJe2iM6n0nKciPUp8y+7E="
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.2/leaflet.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.2/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <script type="text/javascript" src="rent.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
        }
        html, body, #map {
            height: 100%;
            font-family: open sans !important;
        }
        .info {
            padding: 6px 8px;
            font: 14px/16px 'Open Sans', sans-serif;
            background: white;
            background: rgba(255, 255, 255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            color: #6b8cb9;
        }
        .dropDown h4 {
            margin: 0 0 5px;
            color: #0b3e6b !important;
            max-width:200px;
            word-wrap:break-word;
            margin-left:auto;
            margin-right:auto;
            display: block;            
        }
        .info h4 {
            margin: 0 0 5px;
            max-width:200px;
            word-wrap:break-word;
            margin-left:auto;
            margin-right:auto;
            color: #0b3e6b !important;
        }
        .legend {
            line-height: 18px;
            color: #6b8cb9;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }
        .dropDown {
            padding: 4px 4px;
            font: 14px/16px 'Open Sans', sans-serif;
            background: white;
            background: rgba(255, 255, 255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            width:217px;
        }
        select {
            margin-left: auto;
            margin-right: auto;
            display: block;
            text-align-last: center;
            color: #6b8cb9;
            font-family:'Open Sans', sans-serif;
            width: 150px;
        }
        small {
            font-size: smaller;
            display: block;
            float:right;
        }
    </style>
</head>

<body>
<div id="map">
    <script>
        if ($(window).width() > 1460 & $(window).height() > 720){
            var map = L.map('map').setView([39.826064, -96], 5);
        } else{
            var map = L.map('map').setView([39.826064, -96], 4);            
        }

        var Acetate_all = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
            attribution: 'Map tiles by <a href="https://carto.com">Carto</a> | Data by <a href="http://openstreetmap.org">OpenStreetMap</a>, under <a href="http://www.openstreetmap.org/copyright">ODbL</a> | <a href="https://www.huduser.gov/portal/datasets/50per.html">Median Rent Estimates</a> | <a href="https://www.bls.gov/data/inflation_calculator.htm">Inflation Calculator</a> | Prepared by <a href="http://www.bigwaterconsulting.net">Big Water Consulting</a>',
            subdomains: '0123',
            minZoom: 3,
            maxZoom: 15
        }).addTo(map);

        var info = L.control();
        var mod = "one_br";

        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };

        info.update = function (props) {   
            this._div.innerHTML = '<h4 style="text-align: center;">HUD Estimated Median Monthly Rent Increases<br>(Inflation Adjusted)<br>2015 to 2025</h4>' +  (props ?
                '<h4 style="text-align: center;">' + props.areaname18 + '</h4>' 
                + '<table> <tr><td>Rent, 2015:</td> <td>$' + numberWithCommas(Math.round(props.b1_i)) + '</td>'
                + '<tr><td>Rent, 2025:</td> <td>$' + numberWithCommas((props.re_1)) + '</td>'
                + '<tr><td>Rent increase:</td> <td>$' + numberWithCommas((props.re_1 - Math.round(props.b1_i))) + '</td></tr></table>' +
                '<small>*Adjusted for inflation to 2025 prices.</small>'
                : 'Hover over or click on a region');
        };

        var geojson = L.geoJson(rentData, {
            style: function (feature) {
                return {
                    fillColor: getColor(feature.properties.re_1 - feature.properties.b1_i),
                    weight: 1.0,
                    opacity: 0.7,
                    color: 'white',
                    dashArray: '0',
                    fillOpacity: 0.7
                };
            },
            onEachFeature: function (feature, layer) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                    click: info.update
                });
            }
        }).addTo(map);

        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({
                weight: 2,
                color: '#555',
                fillOpacity: 0.7
            });
            layer.bringToFront();
        }

        function resetHighlight(e) {
            geojson.resetStyle(e.target);
        }

        function numberWithCommas(number) {
            return number.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        info.addTo(map);
    </script>
</div>
</body>
</html>
