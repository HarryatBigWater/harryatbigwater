<!DOCTYPE html>
<html>
<head>
    <title>HUD Estimated Rent Changes 2015 - 2025</title>
    <script
        src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha256-3edrmyuQ0w65f8gfBsqowzjJe2iM6n0nKciPUp8y+7E="
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.2/leaflet.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.2/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <script type="text/javascript" src="rent.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
        }
        html, body, #map {
            height: 100%;
            font-family: 'Open Sans', sans-serif !important;
        }
        .info {
            padding: 6px 8px;
            font: 14px/16px 'Open Sans', sans-serif;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            color: #6b8cb9;
        }
        .dropDown h4, .info h4 {
            margin: 0 0 5px;
            max-width: 200px;
            word-wrap: break-word;
            margin-left: auto;
            margin-right: auto;
            color: #0b3e6b !important;
        }
        .legend {
            line-height: 18px;
            color: #6b8cb9;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }
        .dropDown {
            padding: 4px 4px;
            font: 14px/16px 'Open Sans', sans-serif;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            width: 217px;
        }
        select {
            margin-left: auto;
            margin-right: auto;
            display: block;
            text-align-last: center;
            color: #6b8cb9;
            font-family: 'Open Sans', sans-serif;
            width: 150px;
        }
        small {
            font-size: smaller;
            display: block;
            float: right;
        }
    </style>
</head>

<body>

<div id="map">
    <script>
        if ($(window).width() > 1460 & $(window).height() > 720) {
            var map = L.map('map').setView([39.826064, -96], 5);
        } else {
            var map = L.map('map').setView([39.826064, -96], 4);
        }

        var Acetate_all = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
            attribution: 'Map tiles by <a href="https://carto.com">Carto</a> | Data by <a href="http://openstreetmap.org">OpenStreetMap</a>, under <a href="http://www.openstreetmap.org/copyright">ODbL</a> | <a href="https://www.huduser.gov/portal/datasets/50per.html">Median Rent Estimates</a> | <a href="https://www.bls.gov/data/inflation_calculator.htm">Inflation Calculator</a> | Prepared by <a href="http://www.bigwaterconsulting.net">Big Water Consulting</a>',
            subdomains: '0123',
            minZoom: 3,
            maxZoom: 15
        }).addTo(map);

        var info = L.control();
        var mod = "one_br";

        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };

        function numberWithCommas(number) {
            return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        info.update = function (props) {
            switch (mod) {
                case 'studio':
                    this._div.innerHTML = '<h4 style="text-align: center;">HUD Estimated Median Monthly Rent Increases<br>(Inflation Adjusted)<br>2015 to 2025</h4>' + (props ?
                        '<h4 style="text-align: center;">' + props.areaname25 + '</h4>'
                        + '<table> <tr><td>Studio rent, 2015*:</td> <td>$' + numberWithCommas(Math.round(props.b0_i)) + '</td>'
                        + '<tr><td>Studio rent, 2025:</td> <td>$' + numberWithCommas((props.rent)) + '</td>'
                        + '<tr><td>Studio rent increase:</td> <td>$' + numberWithCommas((props.rent - Math.round(props.b0_i))) + '</td></tr></table>'
                        + '<small>*Adjusted for inflation to 2025 prices.</small>'
                        : 'Hover over or click on a region');
                    break;
                // Repeat similar changes for one_br, two_br, three_br, and four_br cases
            }
        };

        var dropDown = L.control({ position: 'bottomright' });
        dropDown.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'dropDown');
            this._div.innerHTML = ('<h4 style="text-align: center;">Select Number of Bedrooms</h4>' +
                '<select onchange="getval(this.value, event);" onclick="disProp(event);" onfocus="disProp(event);"><option value="studio">Studio</option><option value="one_br" selected>One Bedroom</option><option value="two_br">Two Bedrooms</option><option value="three_br">Three Bedrooms</option><option value="four_br">Four Bedrooms</option></select>');
            return this._div;
        };

        function getColor(d) {
            return d >= 300 ? '#d73027' :
                d >= 150 ? '#fc8d59' :
                    d >= 50 ? '#fee08b' :
                        d >= -50 ? '#ffffbf' :
                            d >= -150 ? '#d9ef8b' :
                                d >= -300 ? '#91cf60' :
                                    '#1a9850';
        }

        function style(feature) {
            return {
                fillColor: getColor(feature.properties.re_1 - feature.properties.b1_i),
                weight: 1.0,
                opacity: 0.7,
                color: 'white',
                fillOpacity: 0.7
            };
        }

        var geojson = L.geoJson(rentData, {
            style: style,
        }).addTo(map);

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = "<h4 style='text-align: center;'>Monthly Rent Increase</h4>";
            return div;
        };

        legend.addTo(map);
        info.addTo(map);
        dropDown.addTo(map);
    </script>
</div>
</body>
</html>
