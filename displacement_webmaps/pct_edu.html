<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juxtapose Map Comparison</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        /* Juxtapose Container */
        #juxtapose-wrapper {
            max-width: 90vw;
            max-height: 80vh;
            width: 800px;
            height: 600px;
            margin: auto;
            border: 2px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Juxtapose Customizations */
        .jx-knightlab {
            visibility: visible;
        }

        .juxtapose-name {
            visibility: hidden;
        }

        .jx-handle {
            color: #486382;
        }

        .jx-controller {
            border-radius: 4px;
        }

        .jx-image .jx-label {
            font-size: 1.2em !important;
            background: rgba(72, 99, 130, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
    <script src="https://cdn.knightlab.com/libs/juxtapose/latest/js/juxtapose.min.js"></script>
    <link rel="stylesheet" href="https://cdn.knightlab.com/libs/juxtapose/latest/css/juxtapose.css">
</head>
<body>

<div id="juxtapose-wrapper" class="juxtapose" 
     data-showlabels="true" 
     data-animate="true" 
     data-mode="vertical"
     style="width: 100%; height: 100%;">
    <img src="pct_edu_2016.png" data-label="2016 Education Levels"/>
    <img src="pct_edu_2000.png" data-label="2000 Education Levels"/>
</div>

</body>
</html>
